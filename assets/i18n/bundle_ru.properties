# --- Вступительная история ---
intro.title=ЛЕСНАЯ ТРОПА
intro.page.1=Я всего лишь решил срезать путь. Тропа казалась знакомой, и я был уверен, что скоро выйду к дороге. Но шум машин стих, а каждый поворот уводил меня всё глубже под кроны.
intro.page.2=Я не заметил, как опустился туман. Телефон разрядился. Метки, которые я оставлял на деревьях, начали повторяться. Я уже не понимал, иду ли по кругу.
intro.page.3=В сумерках я почувствовал запах дыма. На поляне горел небольшой костёр, рядом стояла корзина грибов. У огня никого не было. Только длинная тень тянулась от пламени к деревьям.
intro.page.4=Тень шевельнулась. Из-за ствола вышел высокий силуэт: бледный череп обрамляли рога, а тело — обрывки коры и ткани. Он назвался хозяином леса и сказал, что может вывести меня.
intro.page.5=Фигура поставила между нами корзину и тихо предложила сыграть. Я посмотрел на грибы, потом на маску. Он что, и правда предлагает поиграть?
intro.next=ДАЛЬШЕ
intro.start=СЫГРАТЬ

