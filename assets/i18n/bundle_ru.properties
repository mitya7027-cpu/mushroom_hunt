# ============================================================
# Mushroom Hunt — русские строки (оверлей поверх базы).
#
# I18NBundle подгрузит bundle.properties (английский) и заменит
# в нём ключи из ЭТОГО файла. Незнакомый ключ (забыли перевести)
# честно возьмётся из базы — игра не упадёт, просто покажет
# английский текст. Удобно: добавили ключ в код — сначала
# добавьте его в bundle.properties, потом сюда.
#
# Чтобы добавить третий язык — скопируйте этот файл в
# bundle_de.properties (например) и переведите значения.
# Код менять не нужно вообще.
#
# ВАЖНО: значение ключа — ОДНА строка. Перенос внутри текста
# пишется как \n (два символа: слеш и n), настоящий Enter
# посреди значения сломает файл.
# ============================================================

