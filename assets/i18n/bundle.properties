# --- Попап «Правила» ---
rules.title=RULES
rules.text=Quiet Hunt\nLogline: You got lost in the night forest and stumbled upon a campfire. The fire's owner — the leshy — offers a deal: play his game, and he will show you the way. A basket of mushrooms is poured onto a stump. Some are edible. Some are not.\nCore gameplay\nIt works on the same tension formula as Buckshot Roulette, but with a basket of mushrooms instead of a shotgun:\nThe leshy pours out N mushrooms and honestly announces the contents: 'Six mushrooms: three whites, two toadstools, one fly agaric'\nEat a mushroom yourself -> if it is edible, the turn stays yours (greed is rewarded)\nPush it to the leshy -> if it is poisonous, he loses health, the turn passes to him\nFly agaric = -2 hearts, toadstool = -1 heart. Both have 3-5 hearts per round\nKey difference from the reference: there are three or four outcomes, not two. Probability math becomes more interesting — the player counts combinatorics in their head, not just 'live / blank'.\nUnique mechanics\nHallucinations. The false morel looks edible, but after eating it the interface starts lying — mushroom markers on screen show wrong types for 2 turns. The player must remember what cannot be trusted.\nThe leshy cheats. On later levels the screen periodically 'blinks' dark (like an eye blink) — and a mushroom on the stump may be swapped.\nKnife. Cut a mushroom in half: you learn its type, but eat half of the effect. Knowledge in exchange for damage.\nItems (2-3 slots before a round)\nSalt — a circle of salt: the leshy skips a turn (once per round)\nTitmouse — feed it a mushroom: it disappears from the game with no effect\nFlask of milk — removes hallucination / +1 heart\nMagnifier — peek at what hides under the cap\nStructure\nInstead of 'floors' — forest depth: further from the campfire you meet the kikimora (swaps mushrooms), the vodyanoy (mushrooms 'drown' — hidden for a couple of turns), and the final boss — the leshy himself. Plus an endless mode with a seed and a daily run with a fixed basket for the leaderboard.\nMobile decisions\nVertical screen, tap-only controls, a 3-5 minute session\nVibration on a fly agaric bite, heartbeat sound and campfire crackle\nVisuals — silhouettes in warm firelight, the vibe of 'Hedgehog in the Fog' and Soviet cartoon scare-tales\nMonetization: premium ad-free + cosmetics (baskets, campfires, mushroomer hats)

