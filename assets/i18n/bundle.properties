# ============================================================
# Mushroom Hunt — English strings (BASE bundle).
#
# Это базовый файл локализации: язык по умолчанию (английский).
# Как это работает:
#   I18NBundle сначала читает bundle.properties (этот файл — база),
#   затем ПОДКЛАДЫВАЕТ сверху bundle_ru.properties — ключи из
#   русского файла ЗАМЕНЯЮТ базовые. Поэтому новый язык =
#   один новый файл bundle_xx.properties, без правок кода.
#
# Формат — обычный key=value. ВАЖНО: значение — ОДНА строка,
# перенос текста внутри значения пишется как \n (слеш + буква n),
# настоящий Enter посреди значения сломает файл.
# Кириллица — как есть, файл в UTF-8, эскейпить не нужно.
#
# Если в коде попросили ключ, которого здесь нет, — на экране
# будет видно [no-locale: ключ]. Это специально: баг сразу
# бросается в глаза, а не прячется.
# ============================================================

